    etype: x.r.etype, err: x.text, info: '', cr: pname(x.created), ex: pname(x.executed), md: pname(x.modified), mg: pname(x.manager), resp: pname(x.resp), imp: x.r.imp, first: x.f, due: x.due,
    closed: closed ? x.c : null, fixer: closed && x.fixer >= 0 ? pname(x.fixer) : '', exc: closed && x.exc >= 0 ? R.excs[x.exc] : '',
    rule_code: x.r.code, domain: x.r.domainName, product: x.r.productName, dimension: x.r.dimName, unit: x.r.unitName, entity_type: ['CLIENT', 'CLIENT', 'ACCOUNT', 'CONTRACT', 'TRANSACTION', 'OPERATION'][x.r.ent], error_code: x.r.code.replace('DQR-', 'E') + '_' + x.k % 7, issue_key: x.id}; });
  requestAnimationFrame(() => tableChart(c.body, 'journal', [
    {k: 'st', label: 'Статус', render: (r) => tag(STTG[r.st], r.st)}, {k: 'tobo', label: 'Отделение', nw: true}, {k: 'src', label: 'Источник', nw: true}, {k: 'ent', label: 'Тип объекта', nw: true}, {k: 'oid', label: 'ID объекта', nw: true}, {k: 'oname', label: 'Объект', nw: true},
    {k: 'field', label: 'Поле'}, {k: 'actual', label: 'Сейчас', cls: () => 'bad'}, {k: 'expected', label: 'Должно быть'}, {k: 'etype', label: 'Тип ошибки'}, {k: 'err', label: 'Описание', wide: true}, {k: 'info', label: 'Доп. информация'},
    {k: 'cr', label: 'Создал', nw: true}, {k: 'ex', label: 'Провёл', nw: true}, {k: 'md', label: 'Изменил', nw: true}, {k: 'mg', label: 'Менеджер', nw: true}, {k: 'resp', label: 'Ответственный', nw: true},
    {k: 'imp', label: 'Важность', render: (r) => tag(IMPTG[r.imp], r.imp)}, {k: 'first', label: 'Обнаружена', num: true, fmt: fdY}, {k: 'due', label: 'Срок', num: true, fmt: fdY, cls: (r) => (r.st === 'Просрочена' ? 'bad' : '')},
    {k: 'closed', label: 'Закрыта', num: true, fmt: (v) => (v == null ? '' : fdY(v))}, {k: 'fixer', label: 'Исправил', nw: true}, {k: 'exc', label: 'Причина исключения'},
    {k: 'rule_code', label: 'rule_code', svc: true}, {k: 'domain', label: 'domain', svc: true}, {k: 'product', label: 'data_product', svc: true}, {k: 'dimension', label: 'dimension', svc: true}, {k: 'unit', label: 'responsible_unit', svc: true},
    {k: 'entity_type', label: 'entity_type', svc: true}, {k: 'error_code', label: 'error_code', svc: true}, {k: 'issue_key', label: 'issue_key', svc: true}], rows, {size: 25}));
  return g;
}

// ---------- shell ----------
const tabsEl = document.getElementById('tabs'), gridHost = document.getElementById('grid');
for (const [k, t] of TABS) { const b = el('button', 'tab', t); b.type = 'button'; b.id = 'tab-' + k; b.setAttribute('role', 'tab'); b.addEventListener('click', () => { S.tab = k; try { history.replaceState(null, '', '#' + k); } catch (e) {} render(); }); tabsEl.append(b); }
document.getElementById('meta').textContent = `Данные на ${fdY(N - 1)} 06:00 · Superset 7`;
let gridHostRef = gridHost;
function render() {
  [...tabsEl.children].forEach((b) => b.setAttribute('aria-selected', String(b.id === 'tab-' + S.tab)));
  const d = A.asof; let g;
  if (S.tab === 'overview') g = pageOverview(d); else if (S.tab === 'impact') g = pageImpact(d); else if (S.tab === 'journal') g = pageJournal(d); else g = pageDim(S.tab, d);
  g.id = 'grid'; gridHostRef.replaceWith(g); gridHostRef = g;
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 200); });
renderFilters(); render();
})();
</script>
